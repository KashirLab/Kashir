name: Publish to Zapstore

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download zsp
        run: |
          curl --fail --show-error --location --retry 3 \
            "https://github.com/zapstore/zsp/releases/download/v2.0.1/zsp-2.0.1-linux-amd64" \
            --output "$RUNNER_TEMP/zsp"
          printf '%s  %s\n' \
            '1ef5373f8ecd9ba63d2c3fab98abb0d31b2244a2aac31b3749fb205c7d5f5b38' \
            "$RUNNER_TEMP/zsp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/zsp"
          "$RUNNER_TEMP/zsp" --version

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.SIGN_WITH }}
        run: '"$RUNNER_TEMP/zsp" publish -q'
